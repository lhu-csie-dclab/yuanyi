name: Code Quality & Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Run go vet
      run: go vet ./...

    - name: Check Formatting (gofmt)
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "The following files require gofmt formatting:"
          gofmt -l .
          exit 1
        fi
